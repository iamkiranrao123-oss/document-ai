services:

  backend:
    build: .
    container_name: document-ai-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - chroma_data:/app/chroma_db
      - uploads_data:/app/uploads

    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  frontend:
    build: .
    container_name: document-ai-frontend

    ports:
      - "8501:8501"

    environment:
      API_URL: http://backend:8000

    depends_on:
      backend:
        condition: service_healthy

    command: streamlit run frontend/app.py --server.address=0.0.0.0 --server.port=8501


  tests:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: document-ai-tests

    volumes:
      - ./:/app

    env_file:
      - .env

    command: sh -c "pip install --no-cache-dir pytest && python -m pytest tests -v"


volumes:
  chroma_data:
  uploads_data: